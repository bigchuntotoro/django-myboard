{% load socialaccount %}
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>로그인</title>
    <style>
      .login-container {
        max-width: 400px;
        margin: 100px auto;
        padding: 30px;
        text-align: center;
        border: 1px solid #ddd;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .btn-kakao {
        display: block;
        width: 100%;
        padding: 12px 0;
        background-color: #fee500;
        color: #000000;
        text-decoration: none;
        font-weight: bold;
        border-radius: 6px;
        margin-top: 20px;
        box-sizing: border-box;
      }
      .btn-kakao:hover {
        background-color: #e6ce00;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <h2>로그인이 필요합니다</h2>
      <p>서비스를 이용하시려면 소셜 계정으로 로그인해 주세요.</p>

      <!-- 🟢 provider_login_url 태그로 next 값을 확실하게 인코딩 및 세션 전달 -->
      <a
        href="{% provider_login_url 'kakao' next=request.GET.next %}"
        class="btn-kakao"
      >
        카카오로 시작하기
      </a>
    </div>
  </body>
</html>
